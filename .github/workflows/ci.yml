name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests & build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: AidrobeKit unit tests
        working-directory: Packages/AidrobeKit
        run: swift test
      - name: Build app (simulator, unsigned)
        run: |
          # Keep the log short, but always show compiler errors: the tail alone
          # ends in linker noise and hides which line failed.
          set -o pipefail
          xcodebuild build \
            -project Aidrobe.xcodeproj -scheme Aidrobe \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || {
              grep -E "error:" build.log | sort -u | head -n 60
              tail -n 20 build.log
              exit 1
            }
          tail -n 5 build.log

  contracts:
    name: Contract snapshot matches backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check-contracts.sh
      - name: Generator input is up to date
        run: python3 scripts/normalize-openapi.py --check
